{% extends "auth_base.html" %}

{% block title %}Mot de passe oublié — DevShield{% endblock %}

{% block content %}
<div style="text-align: center; margin-bottom: 24px;">
    <h2 style="font-size: 20px; color: var(--auth-text); margin-bottom: 6px;">Mot de passe oublié</h2>
    <p style="font-size: 14px; color: var(--auth-text-muted);">
        Saisissez votre adresse email pour recevoir un lien de réinitialisation.
    </p>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
        <label for="email">Adresse email</label>
        <input type="email" id="email" name="email" placeholder="vous@exemple.com" required autofocus>
        <div style="font-size: 12px; color: var(--auth-text-muted); margin-top: 4px;">
            Saisissez l'email associé à votre compte.
        </div>
    </div>

    <button type="submit" class="btn-primary">
        <i class="fas fa-envelope"></i> Envoyer le lien
    </button>
</form>

<div class="auth-links">
    <a href="{{ url_for('auth.login') }}">Retour à la connexion</a>
</div>
{% endblock %}
