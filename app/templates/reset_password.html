{% extends "auth_base.html" %}

{% block title %}Nouveau mot de passe — DevShield{% endblock %}

{% block content %}
<div style="text-align: center; margin-bottom: 24px;">
    <h2 style="font-size: 20px; color: var(--auth-text); margin-bottom: 6px;">Nouveau mot de passe</h2>
    <p style="font-size: 14px; color: var(--auth-text-muted);">
        Choisissez un nouveau mot de passe pour votre compte.
    </p>
</div>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <input type="password" id="password" name="password" placeholder="Minimum 6 caractères" required minlength="6">
    </div>

    <div class="form-group">
        <label for="confirm_password">Confirmer le mot de passe</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirmez votre mot de passe" required>
    </div>

    <button type="submit" class="btn-primary">
        <i class="fas fa-check"></i> Réinitialiser
    </button>
</form>

<div class="auth-links">
    <a href="{{ url_for('auth.login') }}">Retour à la connexion</a>
</div>
{% endblock %}
